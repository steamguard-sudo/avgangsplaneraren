services:
  - type: web
    name: avgangsplaneraren-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # fylls i manuellt i Render Dashboard, hamnar aldrig i Git
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
