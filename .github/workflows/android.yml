name: Android CI

on:
  push:
    branches: [main]
    # Rena dokändringar behöver inte köra hela Android-bygget. Lägg till fler
    # mönster här (t.ex. LICENSE) vid behov. OBS: en push som rör BÅDE en .md
    # och kod kör ändå workflowen.
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 kör Gradle-daemonen (Gradle 8.7 klarar inte JDK 26, se CLAUDE.md)
      # och matchar Java-toolchainen jvmToolchain(21) i app/build.gradle.kts.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # Litet snabbjobb för backend/ (Node/Express). Ingen testharness där — det
  # här fångar åtminstone syntaxfel. Node 22 matchar prod (render.yaml
  # NODE_VERSION / backend/.node-version).
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check backend
        run: |
          node --check backend/server.js
          node --check backend/cache.js
